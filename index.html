<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2b2118" />
    <!-- 手機 App 化（T012）：可以加到主畫面，從主畫面開是全螢幕 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="汪國志" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>汪國志</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #2b2118;
        overflow: hidden;
        /* 手機觸控（T008）：不要捲動回彈、下拉重新整理、雙擊或兩指放大 */
        overscroll-behavior: none;
        touch-action: none;
        /* 長按不要跳出選字、放大鏡或選單（遊戲裡有長按看資料、長按連續特訓） */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* 輸入框（優惠碼、改台詞）還是要能選字、打字 */
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
        touch-action: manipulation;
      }
      /* 遊戲畫面避開瀏海、圓角與底部橫條（T008）：只用螢幕的安全範圍 */
      #frame {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* 遊戲固定橫向：手機直拿的時候把整個畫面轉 90 度（手機頂端在遊戲的左邊），
         不用關直向鎖定，也不用提示；class 由 src/main.ts 依方向加上 */
      html.wgz-rotated #frame {
        top: 0;
        right: auto;
        bottom: auto;
        left: 100vw;
        width: 100vh;
        width: 100dvh;
        height: 100vw;
        box-sizing: border-box;
        /* 轉過來以後，瀏海在遊戲的左邊、底部橫條在右邊 */
        padding: 0 env(safe-area-inset-bottom, 0px) 0 env(safe-area-inset-top, 0px);
        transform-origin: 0 0;
        transform: rotate(90deg);
      }
    </style>
  </head>
  <body>
    <div id="frame"><div id="game"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
