<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2b2118" />
    <!-- 手機 App 化（T012）：可以加到主畫面，從主畫面開是全螢幕 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="汪國志" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>汪國志</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #2b2118;
        overflow: hidden;
        /* 手機觸控（T008）：不要捲動回彈、下拉重新整理、雙擊或兩指放大 */
        overscroll-behavior: none;
        touch-action: none;
        /* 長按不要跳出選字、放大鏡或選單（遊戲裡有長按看資料、長按連續特訓） */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* 輸入框（優惠碼、改台詞）還是要能選字、打字 */
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
        touch-action: manipulation;
      }
      /* 遊戲畫面避開瀏海、圓角與底部橫條（T008）：只用螢幕的安全範圍 */
      #frame {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* 遊戲固定橫向：直拿的時候蓋一層提示，請玩家把手機橫放 */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: #2b2118;
        color: #f4e9d8;
        font-family:
          system-ui,
          -apple-system,
          'PingFang TC',
          'Noto Sans TC',
          sans-serif;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        text-align: center;
      }
      #rotate .phone {
        width: 54px;
        height: 96px;
        border: 5px solid #f4e9d8;
        border-radius: 12px;
        animation: wgz-rotate 2.4s ease-in-out infinite;
      }
      #rotate .title {
        font-size: 24px;
        font-weight: 700;
      }
      #rotate .hint {
        font-size: 14px;
        opacity: 0.75;
        padding: 0 32px;
        line-height: 1.6;
      }
      @keyframes wgz-rotate {
        0%,
        25% {
          transform: rotate(0deg);
        }
        60%,
        100% {
          transform: rotate(-90deg);
        }
      }
      @media (orientation: portrait) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="frame"><div id="game"></div></div>
    <div id="rotate" role="alert">
      <div class="phone"></div>
      <div class="title">請把手機橫放</div>
      <div class="hint">汪國志是橫向遊戲。<br />如果畫面沒有跟著轉，請關掉手機的直向鎖定。</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
